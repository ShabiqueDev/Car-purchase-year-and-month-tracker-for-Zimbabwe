function statusCell(c){
  if(check(c)==="fail") return '<span class="tag">Checking with supplier</span>';
  if(c.y&&c.m) return '<span class="done">Confirmed</span>';

function show(){
  var raw=$("q").value, q=norm(raw), out=$("result");
  out.className="result";
  if(!q){out.innerHTML='<p class="empty">Type a chassis number to see its year and month.</p>';return}
  var hits=DATA.cars.filter(function(c){return norm(c.c).indexOf(q)>-1});
  if(!hits.length){out.className="result none";out.innerHTML='<p class="empty">No purchased car matches “'+esc(raw)+'”. Check the chassis number on your invoice, or keep typing.</p>';return}
  out.className="result "+({fail:"none",done:"ok",wait:"wait"})[state(hits[0])];

    var bad=check(c)==="fail";
    var yom=bad?'<span class="y">'+c.y+'</span><span class="m">'+(c.m?MONTHS[c.m-1]:"Month being checked")+'</span><span class="pill">Checking with supplier</span><span class="note">We’ll update this soon.</span>'

      :c.y?'<span class="y">'+c.y+'</span><span class="pill">Month: checking with supplier</span><span class="note">We’ll update this soon.</span>'

  }).join("")+(hits.length>3?'<p class="help">'+(hits.length-3)+' more matches. Type more of the chassis number.</p>':"");

function inMonth(){return DATA.cars.filter(function(c){return month==="all"||c.p===month})}

  var ps=[],cnt={};DATA.cars.forEach(function(c){if(!cnt[c.p]){cnt[c.p]=0;ps.push(c.p)}cnt[c.p]++});ps.sort();
  if(month!=="all"&&!cnt[month])month="all";
  $("months").innerHTML='<button class="mbtn" type="button" data-mo="all" aria-pressed="'+(month==="all")+'"><b>All months</b><span>'+DATA.cars.length+' cars</span></button>'

  $("lh").textContent=month==="all"?"Purchased cars":"Purchased "+pmon(month);

  $("chips").innerHTML=[["all","All",base.length],["done","Confirmed",cnt.done],["wait","Checking with supplier",cnt.wait],["fail","Below requested YOM",cnt.fail]].filter(function(a){return a[0]!=="fail"||a[2]>0})
    .map(function(a){return '<button class="chip" type="button" data-f="'+a[0]+'" aria-pressed="'+(filter===a[0])+'">'+a[1]+'<span>'+a[2]+'</span></button>'}).join("");

function parseYM(v){
  if(v==null||v==="") return {y:null,m:null};
  if(v instanceof Date&&!isNaN(v)) return {y:v.getFullYear(),m:v.getMonth()+1};
  var mm=String(v).match(/(\d{4})\D*(\d{1,2})?/);
  if(!mm) return {y:null,m:null};
  var y=+mm[1], m=mm[2]?+mm[2]:null;
  if(y<1950||y>2100) return {y:null,m:null};
  if(m&&(m<1||m>12)) m=null;
  return {y:y,m:m};
}
function monthKey(v){
  var d=v instanceof Date?v:(v?new Date(v):null);
  if(!d||isNaN(d)) return null;
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function cleanRemark(v){
  if(v==null) return "";
  return String(v).split(/\/\s+|\s+\/|\||\.\s+/).map(function(s){return s.replace(/\s+/g," ").replace(/^[\s.]+|[\s.]+$/g,"")}).filter(function(s){return s&&(YM_WORD.test(s)||YR_ABOVE.test(s))&&!/units?\s+required/i.test(s)}).join(". ");
}
function extract(rows,ix){
  var map=new Map(), skipped=0, noDate=[];
  rows.forEach(function(r){
    if(!r) return;
    var mk=String(r[ix.mk]==null?"":r[ix.mk]).trim().toUpperCase();
    var bs=String(r[ix.bs]==null?"":r[ix.bs]).trim().toUpperCase();
    if(mk!=="ZIMBABWE"||bs!=="PURCHASED") return;
    var ch=r[ix.ch]==null?"":String(r[ix.ch]).trim().toUpperCase();
    if(!ch){skipped++;return}
    var ym=parseYM(r[ix.ym]);
    var car={c:ch,y:ym.y,m:ym.m,r:ix.rm>=0?cleanRemark(r[ix.rm]):"",p:ix.dt>=0?monthKey(r[ix.dt]):null};
    if(!car.p) noDate.push(car);
    map.set(norm(ch),car);
  });
  var cars=Array.from(map.values());
  if(noDate.length){
    var counts={};cars.forEach(function(c){if(c.p)counts[c.p]=(counts[c.p]||0)+1});
    var best=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]})[0]||DATA.updated.slice(0,7);
    noDate.forEach(function(c){c.p=best});
  }
  return {cars:cars,skipped:skipped};
}
function parseFile(file){
  return loadXLSX().then(function(){return file.arrayBuffer()}).then(function(buf){
    var names=XLSX.read(buf,{type:"array",bookSheets:true}).SheetNames;
    var order=names.indexOf("List")>-1?["List"].concat(names.filter(function(n){return n!=="List"})):names;
    for(var k=0;k<order.length;k++){
      var n=order[k], ws=XLSX.read(buf,{type:"array",sheets:n,cellDates:true}).Sheets[n];
      if(!ws) continue;
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
      for(var h=0;h<Math.min(15,rows.length);h++){
        var hdr=(rows[h]||[]).map(function(v){return v==null?"":String(v).trim().toUpperCase()});
        var ix={mk:hdr.indexOf("MARKET ASSIGNED"),bs:hdr.indexOf("BID STATUS"),ch:hdr.indexOf("CHASSIS NO"),ym:hdr.indexOf("YEAR & MONTH"),rm:hdr.indexOf("REMARKS"),dt:hdr.indexOf("DATE")};
        if(ix.mk>-1&&ix.bs>-1&&ix.ch>-1&&ix.ym>-1) return extract(rows.slice(h+1),ix);
      }
    }
    throw new Error("cols");
  });
}
function same(a,b){return a.y===b.y&&a.m===b.m&&(a.r||"")===(b.r||"")}
function plan(found){
  var months={};found.cars.forEach(function(c){months[c.p]=1});
  var newKeys={};found.cars.forEach(function(c){newKeys[norm(c.c)]=1});
  var old={};DATA.cars.forEach(function(c){old[norm(c.c)]=c});
  var added=[],changed=[],removed=[];
  found.cars.forEach(function(c){var o=old[norm(c.c)];if(!o)added.push(c);else if(!same(o,c))changed.push(c)});
  DATA.cars.forEach(function(c){if(months[c.p]&&!newKeys[norm(c.c)])removed.push(c)});
  var kept=DATA.cars.filter(function(c){return !months[c.p]&&!newKeys[norm(c.c)]});
  var merged=kept.concat(found.cars).map(function(c,i){return [c,i]})
    .sort(function(a,b){return a[0].p<b[0].p?-1:a[0].p>b[0].p?1:a[1]-b[1]}).map(function(x){return x[0]});
  return {months:Object.keys(months).sort(),added:added,changed:changed,removed:removed,merged:merged,skipped:found.skipped,total:found.cars.length};
}
function openDlg(html){$("dlgbody").innerHTML=html;var d=$("dlg");if(!d.open)d.showModal()}
function closeDlg(){var d=$("dlg");if(d.open)d.close();PENDING=null}
function showPlan(p){
  PENDING=p;
  var list=p.added.map(function(c){return [c,'<span class="newt">New</span>']})
    .concat(p.changed.map(function(c){return [c,'<span class="chgt">Updated</span>']}))
    .concat(p.removed.map(function(c){return [c,'<span class="remt">Removed</span>']}));
  var rowsHtml=list.slice(0,200).map(function(x){var c=x[0];return '<tr><td>'+x[1]+'</td><td class="ch">'+esc(c.c)+'</td><td class="ym">'+esc(ymText(c))+'</td><td class="rm">'+esc(c.r||"")+'</td></tr>'}).join("");
  var nothing=!list.length;
  openDlg('<h3>Check before saving</h3>'
    +'<p>Found <b>'+p.total+'</b> purchased Zimbabwe cars for '+p.months.map(pmon).join(", ")+'. They will replace the cars listed for '+(p.months.length>1?'those months':'that month')+'. Other months stay as they are.</p>'
    +'<div class="sum"><span><b>'+p.added.length+'</b> new</span><span><b>'+p.changed.length+'</b> updated</span><span><b>'+p.removed.length+'</b> removed</span><span><b>'+p.merged.length+'</b> cars in the app after saving</span></div>'
    +(p.skipped?'<p class="msg">'+p.skipped+' purchased car'+(p.skipped>1?'s have':' has')+' no chassis number in the sheet and '+(p.skipped>1?'were':'was')+' left out. '+(p.skipped>1?'They':'It')+' will appear once the chassis number is filled in.</p>':'')
    +(nothing?'<p class="msg">Nothing has changed since the last upload.</p>':'<div class="tablewrap"><table><thead><tr><th></th><th>Chassis number</th><th>Year &amp; month</th><th>Remarks</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>')
    +'<p class="msg" id="dmsg" role="status"></p>'
    +'<div class="acts"><button class="btn" type="button" id="dcancel">Cancel</button><button class="btn primary" type="button" id="dsave"'+(nothing?' disabled':'')+'>Save to app</button></div>');
  $("dcancel").onclick=closeDlg;
  $("dsave").onclick=save;
}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function save(){
  if(!PENDING||!ART) return;
  var b=$("dsave"),m=$("dmsg");b.disabled=true;$("dcancel").disabled=true;m.className="msg";m.textContent="Saving…";
  ART.publish(buildPage({updated:today(),cars:PENDING.merged})).then(function(){
    m.textContent="Saved. The app is reloading with the new list.";
  },function(e){
    var code=e&&e.code;
    m.className="msg err";$("dcancel").disabled=false;
    if(code==="conflict"){m.textContent="Someone else updated the app a moment ago. It is reloading now. Upload the file again after it reloads.";return}
    if(code==="not_writer"||code==="not_granted"||code==="not_declared"||code==="capability_disabled"||code==="capability_removed"||code==="consent_required"){m.textContent="This view can’t save changes. Open the app from your own Claude account to upload.";$("admin").hidden=true;return}
    if(code==="too_large"){m.textContent="The list is too large to save in one page. Contact UFS Procurement support.";return}
    if(code==="rate_limited"){b.disabled=false;m.textContent="Too many saves in a short time. Wait a minute, then click Save again.";return}
    b.disabled=false;m.textContent="Couldn’t save the list. Check your connection, then click Save again.";
  });
}
$("up").onclick=function(){$("file").value="";$("file").click()};
$("file").onchange=function(){
  var f=$("file").files[0];if(!f) return;
  openDlg('<h3>Reading '+esc(f.name)+'</h3><p class="stat">Finding purchased Zimbabwe cars. Large sheets can take up to a minute.</p>');
  parseFile(f).then(function(found){
    if(!found.cars.length){openDlg('<h3>No cars found</h3><p>This file has no rows where MARKET ASSIGNED is Zimbabwe and BID STATUS is Purchased.</p><div class="acts"><button class="btn" type="button" id="dcancel">Close</button></div>');$("dcancel").onclick=closeDlg;return}
    showPlan(plan(found));
  },function(e){
    var why=e&&e.message==="cols"?"The file needs a sheet with these columns: MARKET ASSIGNED, BID STATUS, CHASSIS NO, YEAR & MONTH and REMARKS. Check the headings and upload again."
      :e&&e.message==="load"?"The Excel reader couldn’t load. Check your internet connection and try again."
      :"This file couldn’t be read. Make sure it is an Excel file (.xlsx) and try again.";
    openDlg('<h3>Couldn’t read the file</h3><p>'+why+'</p><div class="acts"><button class="btn" type="button" id="dcancel">Close</button></div>');$("dcancel").onclick=closeDlg;
  });
};
if(window.claude&&typeof window.claude.use==="function"){
  Promise.all([window.claude.use("artifact"),window.claude.use("user")]).then(function(r){
    var art=r[0],user=r[1];
    if(!art||!user) return;
    return Promise.resolve(user.canEdit()).then(function(ok){if(ok){ART=art;$("admin").hidden=false}});
  }).catch(function(){});
}
})();
</script>
